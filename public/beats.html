<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../css/main.css" />
  <title>Music Store - Beats</title>
</head>
<body>
  <header>
    <h1>Beats Collection</h1>
  </header>

  <nav>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="beats.html">Beats</a>
    </div>
    <div class="auth-buttons">
      <a class="register-btn" href="login.html">Login</a>
    </div>
  </nav>

  <div class="container">
    <h2>Available Beats</h2>

    <!-- Upload Button -->
    <button class="register-btn" onclick="showUploadForm()">Upload Beat</button>

    <!-- Hidden Upload Form -->
    <form id="uploadForm" enctype="multipart/form-data" style="display: none;">
      <input type="text" id="title" name="title" placeholder="Beat Title" required />
      <input type="number" id="price" name="price" placeholder="Price ($)" step="0.01" required />
      <input type="file" id="beatUpload" name="audio" accept="audio/*" required />
      <button type="submit" class="register-btn">Submit</button>
    </form>

    <!-- Beat List -->
    <div class="beat-list" id="beatList">
      <!-- Beats will load here -->
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Music Store. All rights reserved.</p>
  </footer>

  <script src="../js/beats.js"></script>
</body>
</html>
